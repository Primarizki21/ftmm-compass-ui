[project]
name = "ftmm-compass-backend"
version = "1.0.0"
description = "FastAPI backend gateway and deterministic prerequisite validator for FTMM Compass"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.29.0",
    "bcrypt<4.1.0",
    "fastapi>=0.115.0",
    "greenlet>=3.5.6",
    "httpx>=0.27.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic>=2.7.0",
    "pyjwt>=2.8.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "slowapi>=0.1.9",
    "uvicorn>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
