name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security:
    name: Security & Secret Leak Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify no classified or sensitive files committed
        run: |
          echo "Scanning git-tracked files for secret or classified patterns..."
          if git ls-files | grep -E "(^Ekstrak/|\.env$|\.env\.local$|\.pem$|\.key$)"; then
            echo "❌ Error: Classified or secret files found committed in Git tree!"
            exit 1
          fi
          echo "✓ Security Guard passed: No classified or sensitive files found."

  frontend:
    name: Frontend Build & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting with oxfmt
        run: pnpm format:check

      - name: Build frontend
        run: pnpm build

  database:
    name: Database Migrations & Seeding Integrity
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ftmm_compass_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize PostgreSQL baseline schema (v2.1 RC1)
        run: |
          if command -v psql >/dev/null 2>&1; then
            PGPASSWORD=postgres psql -h localhost -U postgres -d ftmm_compass_dev -f database/schema_v2_1_rc1.sql
          else
            docker exec -i $(docker ps -q --filter ancestor=postgres:16-alpine) psql -U postgres -d ftmm_compass_dev < database/schema_v2_1_rc1.sql
          fi

      - name: Setup Astral UV
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: uv sync --directory backend

      - name: Verify Alembic migration upgrade to head
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ftmm_compass_dev
        run: uv run --directory backend alembic upgrade head

      - name: Verify Alembic rollback reversibility (-1)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ftmm_compass_dev
        run: |
          uv run --directory backend alembic downgrade -1
          uv run --directory backend alembic upgrade head

      - name: Verify Database Seeder idempotency (2x sequential runs)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ftmm_compass_dev
        run: |
          uv run --directory backend python seed.py
          uv run --directory backend python seed.py

  backend:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ftmm_compass_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize PostgreSQL baseline schema
        run: |
          if command -v psql >/dev/null 2>&1; then
            PGPASSWORD=postgres psql -h localhost -U postgres -d ftmm_compass_dev -f database/schema_v2_1_rc1.sql
          else
            docker exec -i $(docker ps -q --filter ancestor=postgres:16-alpine) psql -U postgres -d ftmm_compass_dev < database/schema_v2_1_rc1.sql
          fi

      - name: Setup Astral UV
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: uv sync --directory backend

      - name: Apply Alembic migrations to head
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ftmm_compass_dev
        run: uv run --directory backend alembic upgrade head

      - name: Static syntax and compilation check
        run: uv run python -m compileall -q backend

      - name: Python lint check with Ruff
        run: uvx ruff check --select E9,F821,F822,F823,F401 backend

      - name: Run backend unit tests
        run: uv run --directory backend python test_backend.py

      - name: Run FastAPI API integration tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ftmm_compass_dev
        run: uv run --directory backend python test_api_endpoints.py

      - name: Run Pre-KRS Polling API integration tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ftmm_compass_dev
        run: uv run --directory backend python test_polling_api.py

  docker-build:
    name: Docker Image Build Guard
    runs-on: ubuntu-latest
    needs: [frontend, backend, database]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image (-q)
        run: docker build -q -f Dockerfile.backend -t ftmm-compass-gateway:ci .

      - name: Build Frontend Docker Image (-q)
        run: docker build -q -f Dockerfile.frontend -t ftmm-compass-frontend:ci .
